apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-night
  namespace: default
  labels:
    app: movie-night
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-night
  template:
    metadata:
      labels:
        app: movie-night
    spec:
      containers:
      - name: movie-night
        image: ghcr.io/erix/movie-night:build-4-sha-d352cc6 # {"$imagepolicy": "flux-system:movie-night"}
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: TMDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: movie-night-secrets
              key: tmdb-api-key
        - name: MDBLIST_API_KEY
          valueFrom:
            secretKeyRef:
              name: movie-night-secrets
              key: mdblist-api-key
        - name: MDBLIST_LIST_ID
          valueFrom:
            secretKeyRef:
              name: movie-night-secrets
              key: mdblist-list-id
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: movie-night-telegram
              key: telegram-bot-token
              optional: true
        - name: TELEGRAM_GROUP_ID
          valueFrom:
            secretKeyRef:
              name: movie-night-telegram
              key: telegram-group-id
              optional: true
        - name: TRAKT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: movie-night-telegram
              key: trakt-client-id
              optional: true
        - name: TRAKT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: movie-night-telegram
              key: trakt-client-secret
              optional: true
        - name: TRAKT_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: movie-night-telegram
              key: trakt-encryption-key
              optional: true
        - name: DATA_DIR
          value: "/data"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/state
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/state
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: movie-night-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: movie-night-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
